services:
  - type: web
    name: janvaani-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janvaani-db
          property: connectionString
      - key: JANVAANI_DEV_AUTH
        value: "true"
      - key: BHASHINI_ULCA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: janvaani-db
    databaseName: janvaani
    user: janvaani
    plan: free
    region: singapore
