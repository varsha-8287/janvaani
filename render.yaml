services:
  - type: web
    name: janvaani-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: janvaani-db
          property: connectionString
      - key: JANVAANI_DEV_AUTH
        value: "true"
      - key: JANVAANI_DEV_REVIEWER_AUTH
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BHASHINI_TIMEOUT_SECONDS
        value: "8"
      - key: BHASHINI_USER_ID
        value: 7f7a16dbb2564131bee470d969899203
      - key: BHASHINI_ULCA_API_KEY
        value: 378f6c24b8-ea4e-4c3c-98b7-23bdb2e96e8c
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

databases:
  - name: janvaani-db
    databaseName: janvaani
    user: janvaani
    plan: free
    region: singapore
